<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableaux HTML</title>
<link rel="stylesheet" href="tableau.css">
</head>
<body>

<h2>Tableau 1</h2>
<table>
  <tr>
    <td colspan="2">RGL1</td>
  </tr>
  <tr>
    <strong></strong><td class="rgl2-cell">RGL2</td></strong>
    <td class="rgl3-cell"><div class="rgl3-text">RGL3</div></td>
  </tr>
</table>

<h2>Tableau 2</h2>
<table>
  <tr>
    <td rowspan="2"><div class="vertical-text">RMS1</div></td>
    <td>RMS2</td>
  </tr>
  <tr>
    <td class="rms3-cell">RMS3</td>
  </tr>
</table>

<h2>Tableau 3</h2>
<table>
  <tr>
    <td colspan="3">A</td>
  </tr>
  <tr>
    <td rowspan="2">B</td>
    <td colspan="2">C</td>
  </tr>
  <tr>
    <td>D</td>
    <td>E</td>
  </tr>
</table>

</body>
</html>
