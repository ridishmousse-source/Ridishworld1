<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>
  <style>
    /* Style général du header */
    header {
    /* bleu foncé */
      color: white;
      padding: 10px 0;
    }

    /* La liste horizontale */
    header ul {
      display: flex;
      align-items: center;
      justify-content: space-between;
      list-style-type: none;
      margin: 0;
      padding: 0 20px;
    }

    /* Les éléments de la liste */
    header li {
      display: flex;
      align-items: center;
    }

    /* Style des images */
    header img {
      height: 95px;
      width: auto;
      border-radius: 8px;
    }

    /* Le titre au centre */
    header h2 {
      margin: 0;
      font-size: 2.8em;
      text-align: center;
    }

    /* Liens sans soulignement */
    header a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>

<body>
  <header>
    <ul>
      <li><a href="https://enseignementsuperieur.gouv.bj/"><img src="MINISTERE.jpg" alt="Logo Ministère" ></a></li>
      <li><h2>Bienvenue dans mon site web</h2></li>
      <li><a href="https://pigier-benin.com/"><img src="PIGIER.jpg" alt="Logo Pigier"></a></li>
    </ul>
  </header>
</body>
</html>
