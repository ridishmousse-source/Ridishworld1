<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Menu</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      height: 100vh;
      background: linear-gradient(135deg, #e6f7ff, #ffe6f0);
    }

    /* --- ZONE DU CONTENU (IFRAME) --- */
    .contenu {
      flex: 3;
      border: none;
      height: 100vh;
      width: 100%;
    }

    /* --- MENU LATÉRAL À DROITE --- */
    .menu {
      flex: 1;
      background: white;
      border-left: 3px solid #ffd6eb;
      box-shadow: -5px 0 15px rgba(0,0,0,0.1);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 25px;
    }

    .menu h2 {
      color: #b30059;
      text-align: center;
      font-size: 1.5rem;
      border-bottom: 2px solid #ffd6eb;
      padding-bottom: 10px;
      margin-bottom: 10px;
      width: 100%;
    }

    .menu a {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #ffb3d9, #e6f7ff);
      padding: 12px;
      border-radius: 10px;
      color: #333;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    .menu a:hover {
      background: linear-gradient(135deg, #ffd6eb, #b3e0ff);
      transform: translateY(-2px);
      color: #b30059;
    }

    footer {
      margin-top: auto;
      font-size: 0.85rem;
      text-align: center;
      color: #777;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
      }
      .menu {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        border-left: none;
        border-top: 3px solid #ffd6eb;
        box-shadow: 0 -5px 10px rgba(0,0,0,0.1);
      }
      .menu a {
        flex: 1 1 40%;
        margin: 5px;
      }
    }
  </style>
</head>

<body>

  <!-- MENU LATÉRAL À DROITE -->
  <div class="menu">
    <h2>Menu</h2>
    <a href="page1.html" target="affiche">Page 1</a>
    <a href="page2.html" target="affiche">Page 2</a>
    <a href="page3.html" target="affiche">Page 3</a>
    <a href="page4.html" target="affiche">Page 4</a>
    <a href="tableau.html" target="affiche">Tableau</a>
    <a href="formulaire.html" target="affiche">Formulaire</a>
    <a href="cv.html" target="affiche">CV</a>
  </div>
</body>
</html>
