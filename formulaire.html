
<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire d'Inscription Complet</title>
    <link rel="stylesheet" href="formulaire.css">
</head>
<body>
    <div class="container">
        <h1>📝 Formulaire d'Inscription</h1>
        <p class="subtitle">Veuillez remplir tous les champs obligatoires (*)</p>


    <form action="#" method="POST" enctype="multipart/form-data">
        
        <!-- INFORMATIONS PERSONNELLES -->
        <div class="form-section">
            <h2 class="section-title">👤 Informations Personnelles</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="nom">Nom <span class="required">*</span></label>
                    <input type="text" id="nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="prenom">Prénom <span class="required">*</span></label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date_naissance">Date de Naissance <span class="required">*</span></label>
                    <input type="date" id="date_naissance" name="date_naissance" required>
                </div>
                <div class="form-group">
                    <label>Sexe <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-option">
                            <input type="radio" id="masculin" name="sexe" value="masculin" required>
                            <label for="masculin">Masculin</label>
                        </div>
                        <div class="radio-option">
                            <input type="radio" id="feminin" name="sexe" value="feminin" required>
                            <label for="feminin">Féminin</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="nationalite">Nationalité <span class="required">*</span></label>
                <select id="nationalite" name="nationalite" required>
                    <option value="">-- Sélectionnez --</option>
                    <option value="benin">Bénin</option>
                    <option value="togo">Togo</option>
                    <option value="nigeria">Nigéria</option>
                    <option value="france">France</option>
                    <option value="autre">Autre</option>
                </select>
            </div>
        </div>

        <!-- COORDONNÉES -->
        <div class="form-section">
            <h2 class="section-title">📞 Coordonnées</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="email" placeholder="exemple@email.com" required>
                </div>
                <div class="form-group">
                    <label for="telephone">Téléphone <span class="required">*</span></label>
                    <input type="tel" id="telephone" name="telephone" placeholder="+229 XX XX XX XX" required>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="adresse">Adresse Complète <span class="required">*</span></label>
                <input type="text" id="adresse" name="adresse" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="ville">Ville <span class="required">*</span></label>
                    <input type="text" id="ville" name="ville" required>
                </div>
                <div class="form-group">
                    <label for="code_postal">Code Postal</label>
                    <input type="text" id="code_postal" name="code_postal">
                </div>
            </div>
        </div>

        <!-- FORMATION ET EXPÉRIENCE -->
        <div class="form-section">
            <h2 class="section-title">🎓 Formation et Expérience</h2>
            
            <div class="form-group full-width">
                <label for="niveau_etude">Niveau d'Études <span class="required">*</span></label>
                <select id="niveau_etude" name="niveau_etude" required>
                    <option value="">-- Sélectionnez --</option>
                    <option value="bepc">BEPC</option>
                    <option value="bac">BAC</option>
                    <option value="licence">Licence</option>
                    <option value="master">Master</option>
                    <option value="doctorat">Doctorat</option>
                </select>
            </div>

            <div class="form-group full-width">
                <label for="domaine">Domaine d'Études <span class="required">*</span></label>
                <input type="text" id="domaine" name="domaine" placeholder="Ex: Informatique, Commerce, etc." required>
            </div>

            <div class="form-group full-width">
                <label>Compétences</label>
                <div class="checkbox-group">
                    <div class="checkbox-option">
                        <input type="checkbox" id="html" name="competences[]" value="html">
                        <label for="html">HTML/CSS</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="js" name="competences[]" value="javascript">
                        <label for="js">JavaScript</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="python" name="competences[]" value="python">
                        <label for="python">Python</label>
                    </div>
                    <div class="checkbox-option">
                        <input type="checkbox" id="design" name="competences[]" value="design">
                        <label for="design">Design</label>
                    </div>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="experience">Expérience Professionnelle (en années)</label>
                <input type="number" id="experience" name="experience" min="0" max="50">
            </div>
        </div>

        <!-- INFORMATIONS COMPLÉMENTAIRES -->
        <div class="form-section">
            <h2 class="section-title">📄 Informations Complémentaires</h2>
            
            <div class="form-group full-width">
                <label for="motivation">Lettre de Motivation</label>
                <textarea id="motivation" name="motivation" placeholder="Expliquez votre motivation..."></textarea>
            </div>

            <div class="form-group full-width">
                <label for="cv">Télécharger votre CV</label>
                <div class="file-upload">
                    <input type="file" id="cv" name="cv" accept=".pdf,.doc,.docx">
                    <div class="file-upload-label">
                        📎 Cliquez pour sélectionner un fichier
                    </div>
                </div>
            </div>

            <div class="form-group full-width">
                <label for="site_web">Site Web / Portfolio</label>
                <input type="url" id="site_web" name="site_web" placeholder="https://exemple.com">
            </div>
        </div>

        <!-- SÉCURITÉ -->
        <div class="form-section">
            <h2 class="section-title">🔒 Sécurité</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Mot de Passe <span class="required">*</span></label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmer le Mot de Passe <span class="required">*</span></label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>
            </div>
        </div>

        <!-- CONDITIONS -->
        <div class="terms">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
                J'accepte les <a href="#" style="color: #667eea;">conditions générales d'utilisation</a> 
                et la <a href="#" style="color: #667eea;">politique de confidentialité</a> <span class="required">*</span>
            </label>
        </div>

        <div class="terms">
            <input type="checkbox" id="newsletter" name="newsletter">
            <label for="newsletter">
                Je souhaite recevoir les actualités et offres par email
            </label>
        </div>

        <!-- BOUTONS -->
        <div class="button-group">
            <button type="reset" class="btn-reset">🔄 Réinitialiser</button>
            <button type="submit" class="btn-submit">✓ Soumettre</button>
        </div>

    </form>
</div>


</body>
</html>
